<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cửa Hàng Của Minh Hiếu</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Roboto', sans-serif; margin: 0; padding: 20px; background: #f4f4f9; }
    h1, h2, h3 { font-family: 'Montserrat', sans-serif; text-align: center; color: #333; }
    .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    
    .product-card { position: relative; background: #eef2f5; padding: 15px; border-radius: 8px; width: 250px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; display: flex; flex-direction: column; }
    .discount-badge { position: absolute; top: 10px; right: 10px; background: #ffd127; color: #ee4d2d; padding: 4px 8px; font-size: 13px; font-weight: bold; border-radius: 3px; z-index: 10;}
    
    .carousel { position: relative; width: 100%; height: 200px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; overflow: hidden; background: #fff;}
    .carousel-slides { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none; }
    .carousel-slides::-webkit-scrollbar { display: none; }
    .carousel-slides img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; cursor: zoom-in; }
    .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; z-index: 2; transition: background 0.2s; }
    .carousel-btn:hover { background: rgba(0,0,0,0.8); }
    .carousel-btn.prev { left: 4px; }
    .carousel-btn.next { right: 4px; }
    
    .product-card h3 { font-size: 16px; margin: 15px 0 5px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 40px; }
    .product-card p { font-size: 13px; color: #666; margin: 0 0 15px 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex-grow: 1; }
    
    .price-container { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; margin-top: auto; margin-bottom: 12px; min-height: 45px;}
    .original-price { color: #888; text-decoration: line-through; font-size: 0.9em; margin-bottom: 2px; }
    .current-price { color: #ee4d2d; font-weight: bold; font-size: 1.3em; }
    
    .btn-primary { background: #0068ff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-family: 'Roboto', sans-serif; font-weight: 500;}
    .btn-primary:hover { background: #0055d4; }
    
    .qty-wrapper { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .qty-btn { background: #e0e0e0; color: #333; border: none; border-radius: 4px; cursor: pointer; font-size: 18px; font-weight: bold; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; padding: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1);}
    .qty-btn:hover { background: #ccc; }
    .qty-input { width: 45px; height: 32px; text-align: center; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; font-family: 'Roboto', sans-serif; box-sizing: border-box; }
    .qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    
    .cart-qty-wrapper { display: flex; align-items: center; gap: 5px; margin-top: 8px; }
    .qty-btn.small { width: 26px; height: 26px; font-size: 14px; }
    .qty-input.small { width: 40px; height: 26px; font-size: 14px; }

    .cart-section { max-width: 600px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .cart-item { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 15px; gap: 15px;}
    .total-price { text-align: right; font-size: 1.5em; color: #d9534f; font-weight: bold; margin-top: 15px; }
    
    .form-group { margin-bottom: 15px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: 'Roboto', sans-serif; font-size: 15px; background: white; }
    
    .form-group select {
      appearance: none;
      background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23666%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E');
      background-repeat: no-repeat; background-position: right 15px top 50%; background-size: 12px auto;
    }
    .form-group select:disabled { background-color: #f9f9f9; cursor: not-allowed; opacity: 0.7;}
    
    .loader { background: #f4f4f9; bottom: 0; left: 0; overflow: hidden; position: fixed; right: 0; top: 0; z-index: 99999; transition: opacity 0.5s ease, visibility 0.5s ease; }
    .loader.hidden { opacity: 0; visibility: hidden; }
    .loader-inner { bottom: 0; height: 60px; left: 0; margin: auto; position: absolute; right: 0; top: 0; width: 100px; }
    .loader-line-wrap { animation: spin 2000ms cubic-bezier(.175, .885, .32, 1.275) infinite; box-sizing: border-box; height: 50px; left: 0; overflow: hidden; position: absolute; top: 0; transform-origin: 50% 100%; width: 100px; }
    .loader-line { border: 4px solid transparent; border-radius: 100%; box-sizing: border-box; height: 100px; left: 0; margin: 0 auto; position: absolute; right: 0; top: 0; width: 100px; }
    .loader-line-wrap:nth-child(1) { animation-delay: -50ms; }
    .loader-line-wrap:nth-child(2) { animation-delay: -100ms; }
    .loader-line-wrap:nth-child(3) { animation-delay: -150ms; }
    .loader-line-wrap:nth-child(4) { animation-delay: -200ms; }
    .loader-line-wrap:nth-child(5) { animation-delay: -250ms; }
    .loader-line-wrap:nth-child(1) .loader-line { border-color: hsl(0, 80%, 60%); height: 90px; width: 90px; top: 7px; }
    .loader-line-wrap:nth-child(2) .loader-line { border-color: hsl(60, 80%, 60%); height: 76px; width: 76px; top: 14px; }
    .loader-line-wrap:nth-child(3) .loader-line { border-color: hsl(120, 80%, 60%); height: 62px; width: 62px; top: 21px; }
    .loader-line-wrap:nth-child(4) .loader-line { border-color: hsl(180, 80%, 60%); height: 48px; width: 48px; top: 28px; }
    .loader-line-wrap:nth-child(5) .loader-line { border-color: hsl(240, 80%, 60%); height: 34px; width: 34px; top: 35px; }
    @keyframes spin { 0%, 15% { transform: rotate(0); } 100% { transform: rotate(360deg); } }
    .loader-text { position: absolute; top: calc(50% + 85px); left: 0; width: 100%; text-align: center; color: #333; font-family: 'Montserrat', sans-serif; letter-spacing: 1px; font-size: 14px; font-weight: 600;}
    
    #floating-cart { position: fixed; bottom: 20px; right: 20px; background-color: #ff4757; color: white; padding: 15px 25px; border-radius: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; z-index: 1000; font-weight: bold; font-family: 'Montserrat', sans-serif; display: none; transition: transform 0.2s; }
    #floating-cart:hover { transform: scale(1.05); }
    #cart-count { background: white; color: #ff4757; border-radius: 50px; padding: 2px 8px; margin-left: 8px; font-size: 14px; }

    .image-modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .image-modal-content { max-width: 95%; max-height: 90vh; object-fit: contain; border-radius: 8px; user-select: none; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .close-modal { position: absolute; top: 15px; right: 25px; color: white; font-size: 40px; font-weight: bold; cursor: pointer; z-index: 2010; line-height: 1; }
    .close-modal:hover { color: #ff4757; }
    
    .modal-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 24px; cursor: pointer; z-index: 2010; display: flex; align-items: center; justify-content: center; transition: background 0.3s;}
    .modal-nav:hover { background: rgba(255,255,255,0.5); }
    .modal-nav.prev { left: 20px; }
    .modal-nav.next { right: 20px; }
    
    .modal-indicator { position: absolute; bottom: 45px; left: 50%; transform: translateX(-50%); color: white; font-size: 14px; font-weight: 500; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 12px; z-index: 2010; user-select: none; font-family: 'Roboto', sans-serif;}
    .modal-dots { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 2010; }
    .modal-dot { width: 10px; height: 10px; background-color: rgba(255,255,255,0.4); border-radius: 50%; cursor: pointer; transition: background-color 0.3s, transform 0.2s; }
    .modal-dot:hover { background-color: rgba(255,255,255,0.8); }
    .modal-dot.active { background-color: white; transform: scale(1.2); box-shadow: 0 0 5px rgba(0,0,0,0.5); }

    @media (max-width: 600px) {
      .modal-nav { display: none; }
    }
  </style>
</head>
<body>

  <h1>CỬA HÀNG CỦA MINH HIẾU</h1>
  
  <div id="loading" class="loader">
    <div class="loader-inner">
      <div class="loader-line-wrap"><div class="loader-line"></div></div>
      <div class="loader-line-wrap"><div class="loader-line"></div></div>
      <div class="loader-line-wrap"><div class="loader-line"></div></div>
      <div class="loader-line-wrap"><div class="loader-line"></div></div>
      <div class="loader-line-wrap"><div class="loader-line"></div></div>
    </div>
    <div class="loader-text" id="loading-text">ĐANG KẾT NỐI DỮ LIỆU...</div>
  </div>
  
  <div class="container" id="product-list"></div>

  <div id="floating-cart" onclick="scrollToCart()">
    🛒 Giỏ hàng <span id="cart-count">0</span>
  </div>

  <div class="cart-section" id="cart-section" style="display: none;">
    <h2>Giỏ hàng của bạn</h2>
    <div id="cart-items"></div>
    <div class="total-price" id="total-price">Tổng cộng: 0đ</div>

    <div style="margin-top: 30px;">
      <h3>Thông tin nhận hàng</h3>
      <div class="form-group"><input type="text" id="customer-name" placeholder="Tên người nhận *" required></div>
      <div class="form-group"><input type="number" id="customer-phone" placeholder="Số điện thoại Zalo *" required></div>
      
      <div class="form-group">
        <select id="tinh" onchange="fetchPhuong(this.value)" required>
          <option value="">Chọn Tỉnh / Thành phố *</option>
        </select>
      </div>
      <div class="form-group">
        <select id="phuong" required disabled>
          <option value="">Chọn Phường / Xã *</option>
        </select>
      </div>
      <div class="form-group"><input type="text" id="customer-address-detail" placeholder="Địa chỉ chi tiết (Số nhà, đường, ngõ...) *" required></div>
      <div class="form-group"><input type="text" id="customer-note" placeholder="Ghi chú (Tùy chọn, VD: Giao giờ hành chính...)"></div>

      <button class="btn-primary" onclick="checkout()" style="background: #ee4d2d; margin-top: 10px;">Lưu & Mở Zalo Gửi Đơn</button>
    </div>
  </div>

  <!-- Modal Phóng to ảnh -->
  <div id="image-modal" class="image-modal">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <button class="modal-nav prev" onclick="changeModalImg(-1)">&#10094;</button>
    <img class="image-modal-content" id="modal-img">
    <button class="modal-nav next" onclick="changeModalImg(1)">&#10095;</button>
    <div id="modal-indicator" class="modal-indicator">1 / 1</div>
    <div id="modal-dots" class="modal-dots"></div>
  </div>

  <script>
    // === DÁN LINK WEB APP CỦA GOOGLE SCRIPT VÀO DƯỚI ĐÂY ===
    const API_URL = "https://script.google.com/macros/s/AKfycby6UyHtOTUpx9o841UXf1DlUf-Pbvonf3e8IpHpnEFudmdfDdkRuLsz_wtEr3vKFdm_/exec"; 
    
    // === SỐ ĐIỆN THOẠI ZALO CỦA BẠN ===
    const zaloPhone = "84355967766"; 
    
    let cart = [];
    let productsData = [];
    let currentModalProductId = null;
    let currentModalImgIndex = 0;

    window.onload = function() {
      loadProducts();
      fetchTinh(); 
      setupModalSwipe();
    };

    async function loadProducts() {
      try {
        let response = await fetch(API_URL);
        productsData = await response.json(); 
        renderProducts(productsData);
      } catch (error) {
        document.getElementById('loading-text').innerHTML = "<span style='color:#ff4d4d;'>Không thể tải dữ liệu, vui lòng kiểm tra lại Link API!</span>";
      }
    }

    async function fetchTinh() {
      try {
        let res = await fetch('https://provinces.open-api.vn/api/v2/p/');
        let data = await res.json();
        let html = '<option value="">Chọn Tỉnh / Thành phố *</option>';
        data.forEach(item => { html += `<option value="${item.code}">${item.name}</option>`; });
        document.getElementById('tinh').innerHTML = html;
      } catch (error) {}
    }

    async function fetchPhuong(idTinh) {
      let phuongSelect = document.getElementById('phuong');
      phuongSelect.innerHTML = '<option value="">Chọn Phường / Xã *</option>';
      if(!idTinh) { phuongSelect.disabled = true; return; }
      phuongSelect.disabled = false;
      try {
        let res = await fetch(`https://provinces.open-api.vn/api/v2/p/${idTinh}?depth=2`);
        let data = await res.json();
        let html = '<option value="">Chọn Phường / Xã *</option>';
        if (data.wards) {
          data.wards.forEach(item => { html += `<option value="${item.code}">${item.name}</option>`; });
        }
        phuongSelect.innerHTML = html;
      } catch (error) {}
    }

    function formatMoney(amount) { return Number(amount).toLocaleString('vi-VN') + "đ"; }

    function scrollCarousel(id, direction) {
      const container = document.getElementById(`slides-${id}`);
      const scrollAmount = container.clientWidth;
      container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }

    function openModal(productId, index) {
      currentModalProductId = productId;
      currentModalImgIndex = index;
      updateModalImage();
      document.getElementById('image-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('image-modal').style.display = 'none';
    }

    function changeModalImg(delta) {
      let product = productsData.find(p => p.id === currentModalProductId);
      if (!product) return;
      currentModalImgIndex += delta;
      if (currentModalImgIndex < 0) currentModalImgIndex = product.images.length - 1;
      if (currentModalImgIndex >= product.images.length) currentModalImgIndex = 0;
      updateModalImage();
    }
    
    function jumpToModalImg(index) {
      currentModalImgIndex = index;
      updateModalImage();
    }

    function updateModalImage() {
      let product = productsData.find(p => p.id === currentModalProductId);
      if (product && product.images[currentModalImgIndex]) {
        document.getElementById('modal-img').src = product.images[currentModalImgIndex];
        document.getElementById('modal-indicator').innerText = (currentModalImgIndex + 1) + " / " + product.images.length;
        
        let dotsContainer = document.getElementById('modal-dots');
        dotsContainer.innerHTML = ''; 
        if (product.images.length > 1) {
          for (let i = 0; i < product.images.length; i++) {
            let dot = document.createElement('div');
            dot.className = 'modal-dot' + (i === currentModalImgIndex ? ' active' : '');
            dot.onclick = function(event) { 
              event.stopPropagation(); 
              jumpToModalImg(i); 
            };
            dotsContainer.appendChild(dot);
          }
        }
      }
    }

    function setupModalSwipe() {
      const modal = document.getElementById('image-modal');
      let touchstartX = 0; let touchendX = 0;

      modal.addEventListener('touchstart', e => {
        if(e.touches.length > 1) return;
        touchstartX = e.changedTouches[0].screenX;
      });

      modal.addEventListener('touchend', e => {
        if(e.changedTouches.length > 1) return;
        touchendX = e.changedTouches[0].screenX;
        handleSwipe();
      });

      function handleSwipe() {
        if (touchendX < touchstartX - 50) changeModalImg(1);
        if (touchendX > touchstartX + 50) changeModalImg(-1);
      }

      window.onclick = function(event) {
        if (event.target == modal) closeModal();
      }
    }

    function changeProductQty(id, delta) {
      let input = document.getElementById('qty-' + id);
      let val = parseInt(input.value) || 1;
      val += delta;
      if (val < 1) val = 1;
      input.value = val;
    }
    
    function validateProductQty(id) {
      let input = document.getElementById('qty-' + id);
      let val = parseInt(input.value);
      if (isNaN(val) || val < 1) input.value = 1;
    }

    function renderProducts(products) {
      document.getElementById('loading').classList.add('hidden');
      const list = document.getElementById('product-list');
      
      products.forEach(p => {
        let card = document.createElement('div');
        card.className = 'product-card';
        
        let badgeHtml = '';
        let priceHtml = '';
        let orig = Number(p.originalPrice) || 0;
        let curr = Number(p.price) || 0;

        if (orig > curr && curr > 0) {
          let percent = Math.round(((orig - curr) / orig) * 100);
          badgeHtml = `<div class="discount-badge">-${percent}%</div>`;
          priceHtml = `<div class="original-price">${formatMoney(orig)}</div><div class="current-price">${formatMoney(curr)}</div>`;
        } else {
          priceHtml = `<div class="original-price" style="visibility:hidden;">0đ</div><div class="current-price">${formatMoney(curr)}</div>`;
        }

        let safeName = p.name.replace(/'/g, "\\'");
        
        let imagesHtml = '';
        p.images.forEach((img, index) => {
          imagesHtml += `<img src="${img}" alt="${safeName}" onclick="openModal('${p.id}', ${index})">`;
        });

        let arrowsHtml = '';
        if (p.images.length > 1) {
          arrowsHtml = `
            <button class="carousel-btn prev" onclick="scrollCarousel('${p.id}', -1)">&#10094;</button>
            <button class="carousel-btn next" onclick="scrollCarousel('${p.id}', 1)">&#10095;</button>
          `;
        }
        
        card.innerHTML = `
          ${badgeHtml}
          <div class="carousel">
            <div class="carousel-slides" id="slides-${p.id}">${imagesHtml}</div>
            ${arrowsHtml}
          </div>
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
          <div class="price-container">${priceHtml}</div>
          
          <div class="qty-wrapper">
            <button class="qty-btn" onclick="changeProductQty('${p.id}', -1)">-</button>
            <input type="number" id="qty-${p.id}" class="qty-input" value="1" min="1" onchange="validateProductQty('${p.id}')">
            <button class="qty-btn" onclick="changeProductQty('${p.id}', 1)">+</button>
          </div>
          <button class="btn-primary" onclick="addToCart('${p.id}', '${safeName}', ${curr})">Thêm vào giỏ</button>
        `;
        list.appendChild(card);
      });
    }

    function addToCart(id, name, price) {
      let qtyInput = document.getElementById('qty-' + id);
      let qtyToAdd = parseInt(qtyInput.value) || 1;

      let item = cart.find(i => i.id === id);
      if (item) { item.qty += qtyToAdd; } else { cart.push({ id, name, price, qty: qtyToAdd }); }
      
      qtyInput.value = 1; 
      updateCart();
      alert(`Đã thêm ${qtyToAdd} sản phẩm [ ${name} ] vào giỏ hàng!`);
    }

    function changeCartQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty < 1) cart[index].qty = 1;
      updateCart();
    }
    
    function setCartQty(index, value) {
      let val = parseInt(value);
      if (isNaN(val) || val < 1) val = 1;
      cart[index].qty = val;
      updateCart();
    }

    function updateCart() {
      const cartDiv = document.getElementById('cart-items');
      const cartSection = document.getElementById('cart-section');
      const floatingCart = document.getElementById('floating-cart');
      
      cartDiv.innerHTML = '';
      let total = 0;
      let totalQty = 0; 
      const shippingFee = 18000;

      if (cart.length > 0) { 
        cartSection.style.display = 'block'; 
        floatingCart.style.display = 'block'; 
      } else { 
        cartSection.style.display = 'none'; 
        floatingCart.style.display = 'none'; 
      }

      cart.forEach((item, index) => {
        let itemTotal = item.price * item.qty;
        total += itemTotal;
        totalQty += item.qty;
        
        cartDiv.innerHTML += `
          <div class="cart-item">
            <div style="flex: 1; padding-right: 10px;">
              <b style="font-size: 14px; line-height: 1.4;">${item.name}</b>
              <div class="cart-qty-wrapper">
                <button class="qty-btn small" onclick="changeCartQty(${index}, -1)">-</button>
                <input type="number" class="qty-input small" value="${item.qty}" min="1" onchange="setCartQty(${index}, this.value)">
                <button class="qty-btn small" onclick="changeCartQty(${index}, 1)">+</button>
              </div>
            </div>
            <div style="white-space: nowrap; display: flex; flex-direction: column; align-items: flex-end;">
              <span style="font-weight: 500;">${formatMoney(itemTotal)}</span>
              <span style="color:red; cursor:pointer; margin-top:8px; font-weight:bold; font-size:0.9em;" onclick="removeItem(${index})">Xóa</span>
            </div>
          </div>
        `;
      });
      
      if (total > 0) {
        let finalTotal = total + shippingFee;
        document.getElementById('total-price').innerHTML = `
          <div style="font-size: 0.7em; color: #666; font-weight: normal;">Tiền hàng: ${formatMoney(total)}</div>
          <div style="font-size: 0.7em; color: #666; font-weight: normal;">Phí giao hàng: ${formatMoney(shippingFee)}</div>
          <div style="margin-top: 5px; color: #ee4d2d;">Tổng cộng: ${formatMoney(finalTotal)}</div>
        `;
      }
      document.getElementById('cart-count').innerText = totalQty; 
    }

    function removeItem(index) { cart.splice(index, 1); updateCart(); }
    function scrollToCart() { document.getElementById('cart-section').scrollIntoView({ behavior: 'smooth' }); }

    function checkout() {
      const name = document.getElementById('customer-name').value;
      const phone = document.getElementById('customer-phone').value;
      const detailAddress = document.getElementById('customer-address-detail').value;
      const note = document.getElementById('customer-note').value;
      
      const tinhSelect = document.getElementById('tinh');
      const phuongSelect = document.getElementById('phuong');
      
      const tinhName = tinhSelect.options[tinhSelect.selectedIndex]?.text || '';
      const phuongName = phuongSelect.options[phuongSelect.selectedIndex]?.text || '';

      const shippingFee = 18000;

      if (!name || !phone || !detailAddress || !tinhSelect.value || !phuongSelect.value) { 
        alert("Vui lòng điền đầy đủ Thông tin cá nhân và Địa chỉ nhận hàng!"); 
        return; 
      }

      let fullAddress = `${detailAddress}, ${phuongName}, ${tinhName}`;

      let orderText = "🛒 ĐƠN ĐẶT HÀNG MỚI\n";
      orderText += "👤 Khách: " + name + "\n";
      orderText += "📞 SĐT: " + phone + "\n";
      orderText += "📍 Địa chỉ: " + fullAddress + "\n";
      if(note) orderText += "📝 Ghi chú: " + note + "\n";
      orderText += "------------------------\n";
      
      let total = 0;
      let itemsForSheet = [];

      cart.forEach(item => {
        orderText += `- ${item.name} (x${item.qty}): ${formatMoney(item.price * item.qty)}\n`;
        itemsForSheet.push(`- ${item.name} (x${item.qty})`);
        total += (item.price * item.qty);
      });
      
      let finalTotal = total + shippingFee;

      orderText += "------------------------\n";
      orderText += "📦 Tiền hàng: " + formatMoney(total) + "\n";
      orderText += "🚚 Phí giao hàng: " + formatMoney(shippingFee) + "\n";
      orderText += "💰 TỔNG THANH TOÁN: " + formatMoney(finalTotal);

      // --- PHẦN GỬI DỮ LIỆU NGẦM VỀ GOOGLE SHEETS ---
      let orderData = {
        action: "createOrder",
        name: name,
        phone: phone, 
        address: fullAddress,
        note: note,
        itemsText: itemsForSheet.join('\n'), // Hiển thị text cho dễ nhìn
        total: formatMoney(finalTotal),
        cartJSON: JSON.stringify(cart) // Dữ liệu máy đọc để tự động trừ kho
      };

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(orderData)
      }).then(() => console.log("Đã gửi đơn hàng"))
        .catch(err => console.error(err));
      // ------------------------------------------------

      // Copy text và mở Zalo
      const tempTextArea = document.createElement("textarea");
      tempTextArea.value = orderText;
      document.body.appendChild(tempTextArea);
      tempTextArea.select();
      
      try {
        document.execCommand("copy");
        alert("📋 ĐÃ LƯU ĐƠN HÀNG VÀ CHUYỂN VỀ HỆ THỐNG!\n\nHệ thống sẽ mở Zalo của Shop. Bạn chỉ cần bấm DÁN (Paste) vào khung chat để gửi đơn nhé!");
      } catch (err) {
        alert("Trình duyệt không hỗ trợ copy tự động. Vui lòng nhắn tin trực tiếp cho Shop nhé!");
      }
      document.body.removeChild(tempTextArea);
      window.open("https://zalo.me/" + zaloPhone, "_blank");
    }
  </script>
</body>
</html>
